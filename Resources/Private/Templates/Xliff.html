<?xml version="1.0" encoding="UTF-8"?>
<xliff version="2.0" xmlns="urn:oasis:names:tc:xliff:document:2.0" srcLang="{sourcelang}"{f:if(condition:'{targetlang}',then:' trgLang="{targetlang}"')}>
	<file id="f1" original="{original}"><f:for each="{labels}" as="label" key="key">
		<unit id="{key}">
			<segment{f:if(condition:'{targetlang}',then:' state="{label.0.state}"')}>
				<source>{label.0.source->f:format.raw()}</source><f:if condition="{targetlang}">
				<target>{label.0.target->f:format.raw()}</target></f:if>
			</segment>
		</unit></f:for>
	</file>
</xliff>
